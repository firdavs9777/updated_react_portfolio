# Weekly check that every link on firdavs.dev still works: GitHub repos,
# app store pages, project sites, and the CV PDFs. A failed run means a
# link is broken; GitHub emails the repo owner.

name: Check links

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 KST
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links in the site source
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --base https://firdavs.dev
            --accept 200..=299,429
            --max-retries 3
            --exclude 'linkedin\.com'
            --exclude '^mailto:'
            --exclude '^tel:'
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            --exclude 'schema\.org'
            --exclude 'api\.banatalk\.com'
            --exclude 'maps\.google\.com'
            'src/**/*.ts'
            'src/**/*.tsx'
            index.html
          fail: true
